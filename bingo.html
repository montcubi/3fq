<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo de Formulació - 3r ESO</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            .print-break-avoid { break-inside: avoid; page-break-inside: avoid; }
            .print-page-break { page-break-after: always; break-after: page; }
            @page { margin: 1.5cm; size: A4 portrait; }
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        
        /* Animacions afegides pel bombo llampant */
        @keyframes popIn {
            0% { transform: scale(0.5) translateY(30px); opacity: 0; }
            60% { transform: scale(1.1) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .text-glow { text-shadow: 0 0 20px rgba(34, 211, 238, 0.8), 0 0 40px rgba(34, 211, 238, 0.4); }
        .box-glow { box-shadow: 0 0 30px rgba(59, 130, 246, 0.3) inset, 0 10px 30px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Base de dades de compostos (Òxids, Hidrurs, Sals Binàries)
        const COMPOUNDS = [
            // ÒXIDS
            { formula: 'Na2O', stock: "Òxid de sodi", systematic: "Òxid de disodi" },
            { formula: 'K2O', stock: "Òxid de potassi", systematic: "Òxid de dipotassi" },
            { formula: 'MgO', stock: "Òxid de magnesi", systematic: "Òxid de magnesi" },
            { formula: 'CaO', stock: "Òxid de calci", systematic: "Òxid de calci" },
            { formula: 'Al2O3', stock: "Òxid d'alumini", systematic: "Triòxid de dialumini" },
            { formula: 'FeO', stock: "Òxid de ferro(II)", systematic: "Monòxid de ferro" },
            { formula: 'Fe2O3', stock: "Òxid de ferro(III)", systematic: "Triòxid de diferro" },
            { formula: 'CuO', stock: "Òxid de coure(II)", systematic: "Monòxid de coure" },
            { formula: 'Cu2O', stock: "Òxid de coure(I)", systematic: "Òxid de dicoure" },
            { formula: 'ZnO', stock: "Òxid de zinc", systematic: "Òxid de zinc" },
            { formula: 'Ag2O', stock: "Òxid d'argent", systematic: "Òxid de diargent" },
            { formula: 'CO', stock: "Òxid de carboni(II)", systematic: "Monòxid de carboni" },
            { formula: 'CO2', stock: "Òxid de carboni(IV)", systematic: "Diòxid de carboni" },
            { formula: 'SO2', stock: "Òxid de sofre(IV)", systematic: "Diòxid de sofre" },
            { formula: 'SO3', stock: "Òxid de sofre(VI)", systematic: "Triòxid de sofre" },
            { formula: 'NO', stock: "Òxid de nitrogen(II)", systematic: "Monòxid de nitrogen" },
            { formula: 'NO2', stock: "Òxid de nitrogen(IV)", systematic: "Diòxid de nitrogen" },
            { formula: 'PbO2', stock: "Òxid de plom(IV)", systematic: "Diòxid de plom" },
            { formula: 'NiO', stock: "Òxid de níquel(II)", systematic: "Monòxid de níquel" },
            { formula: 'Ni2O3', stock: "Òxid de níquel(III)", systematic: "Triòxid de diníquel" },
            { formula: 'CdO', stock: "Òxid de cadmi", systematic: "Òxid de cadmi" },
            { formula: 'SnO2', stock: "Òxid d'estany(IV)", systematic: "Diòxid d'estany" },
            { formula: 'Au2O3', stock: "Òxid d'or(III)", systematic: "Triòxid de dior" },
            { formula: 'CoO', stock: "Òxid de cobalt(II)", systematic: "Monòxid de cobalt" },
            { formula: 'Co2O3', stock: "Òxid de cobalt(III)", systematic: "Triòxid de dicobalt" },
            { formula: 'P2O3', stock: "Òxid de fòsfor(III)", systematic: "Triòxid de difòsfor" },
            { formula: 'P2O5', stock: "Òxid de fòsfor(V)", systematic: "Pentaòxid de difòsfor" },
            { formula: 'Cl2O', stock: "Òxid de clor(I)", systematic: "Monòxid de diclor" },
            { formula: 'Cl2O7', stock: "Òxid de clor(VII)", systematic: "Heptaòxid de diclor" },
            
            // HIDRURS
            { formula: 'LiH', stock: "Hidrur de liti", systematic: "Hidrur de liti" },
            { formula: 'NaH', stock: "Hidrur de sodi", systematic: "Hidrur de sodi" },
            { formula: 'KH', stock: "Hidrur de potassi", systematic: "Hidrur de potassi" },
            { formula: 'MgH2', stock: "Hidrur de magnesi", systematic: "Dihidrur de magnesi" },
            { formula: 'CaH2', stock: "Hidrur de calci", systematic: "Dihidrur de calci" },
            { formula: 'AlH3', stock: "Hidrur d'alumini", systematic: "Trihidrur d'alumini" },
            { formula: 'NH3', stock: "Amoníac", systematic: "Trihidrur de nitrogen" },
            { formula: 'CH4', stock: "Metà", systematic: "Metà" },
            { formula: 'NiH2', stock: "Hidrur de níquel(II)", systematic: "Dihidrur de níquel" },
            { formula: 'CdH2', stock: "Hidrur de cadmi", systematic: "Dihidrur de cadmi" },
            { formula: 'SnH4', stock: "Hidrur d'estany(IV)", systematic: "Tetrahidrur d'estany" },
            
            // SALS BINÀRIES
            { formula: 'LiCl', stock: "Clorur de liti", systematic: "Clorur de liti" },
            { formula: 'NaCl', stock: "Clorur de sodi", systematic: "Clorur de sodi" },
            { formula: 'KCl', stock: "Clorur de potassi", systematic: "Clorur de potassi" },
            { formula: 'MgCl2', stock: "Clorur de magnesi", systematic: "Diclorur de magnesi" },
            { formula: 'CaCl2', stock: "Clorur de calci", systematic: "Diclorur de calci" },
            { formula: 'AlCl3', stock: "Clorur d'alumini", systematic: "Triclorur d'alumini" },
            { formula: 'FeCl2', stock: "Clorur de ferro(II)", systematic: "Diclorur de ferro" },
            { formula: 'FeCl3', stock: "Clorur de ferro(III)", systematic: "Triclorur de ferro" },
            { formula: 'CuCl', stock: "Clorur de coure(I)", systematic: "Monoclorur de coure" },
            { formula: 'CuCl2', stock: "Clorur de coure(II)", systematic: "Diclorur de coure" },
            { formula: 'NaF', stock: "Fluorur de sodi", systematic: "Fluorur de sodi" },
            { formula: 'CaF2', stock: "Fluorur de calci", systematic: "Difluorur de calci" },
            { formula: 'KBr', stock: "Bromur de potassi", systematic: "Bromur de potassi" },
            { formula: 'AgBr', stock: "Bromur d'argent", systematic: "Bromur d'argent" },
            { formula: 'NaI', stock: "Iodur de sodi", systematic: "Iodur de sodi" },
            { formula: 'KI', stock: "Iodur de potassi", systematic: "Iodur de potassi" },
            { formula: 'PbS', stock: "Sulfur de plom(II)", systematic: "Monosulfur de plom" },
            { formula: 'ZnS', stock: "Sulfur de zinc", systematic: "Sulfur de zinc" },
            { formula: 'MgS', stock: "Sulfur de magnesi", systematic: "Sulfur de magnesi" },
            { formula: 'NiCl2', stock: "Clorur de níquel(II)", systematic: "Diclorur de níquel" },
            { formula: 'CdS', stock: "Sulfur de cadmi", systematic: "Sulfur de cadmi" },
            { formula: 'SnCl2', stock: "Clorur d'estany(II)", systematic: "Diclorur d'estany" },
            { formula: 'AuCl3', stock: "Clorur d'or(III)", systematic: "Triclorur d'or" },
            { formula: 'CoCl2', stock: "Clorur de cobalt(II)", systematic: "Diclorur de cobalt" },
            { formula: 'CoS', stock: "Sulfur de cobalt(II)", systematic: "Monosulfur de cobalt" }
        ];

        // Formatador de fòrmules per posar els subíndexs a les lletres
        const FormatFormula = ({ text }) => {
            if (!text) return null;
            const parts = text.split(/(\d+)/);
            return (
                <span>
                    {parts.map((part, index) => 
                        /^\d+$/.test(part) ? <sub key={index}>{part}</sub> : <span key={index}>{part}</span>
                    )}
                </span>
            );
        };

        // Funció per generar números aleatoris únics
        const getRandomUniqueInts = (count, max) => {
            const set = new Set();
            while (set.size < count) {
                set.add(Math.floor(Math.random() * max));
            }
            return Array.from(set);
        };

        // Generador dels cartrons de Bingo
        const generateCards = (numCards) => {
            const cards = [];
            for (let i = 0; i < numCards; i++) {
                // 3 files x 7 columnes = 21 caselles
                const cells = Array(21).fill(null);
                
                // Triem 12 compostos únics a l'atzar de la llista
                const selectedCompoundsIndexes = getRandomUniqueInts(12, COMPOUNDS.length);
                
                // Assignem exactament 4 compostos a cada una de les 3 files
                let currentCompound = 0;
                for (let row = 0; row < 3; row++) {
                    // Triem 4 columnes a l'atzar (de la 0 a la 6) per a aquesta fila
                    const rowPositions = getRandomUniqueInts(4, 7);
                    
                    rowPositions.forEach(col => {
                        const cellIndex = (row * 7) + col;
                        // Afegim una nomenclatura aleatòria a la casella per si s'usa el mode "Barrejat"
                        cells[cellIndex] = {
                            ...COMPOUNDS[selectedCompoundsIndexes[currentCompound]],
                            cardNomType: Math.random() > 0.5 ? 'stock' : 'systematic'
                        };
                        currentCompound++;
                    });
                }

                cards.push({ id: i + 1, cells });
            }
            return cards;
        };

        const App = () => {
            const [cards, setCards] = React.useState([]);
            const [drawnIndexes, setDrawnIndexes] = React.useState([]); // Ara guardarà { index, type }
            const [activeTab, setActiveTab] = React.useState('cards');
            
            // Àudio
            const audioRef = React.useRef(null);
            const [isMusicPlaying, setIsMusicPlaying] = React.useState(false);
            const [userToggledMusic, setUserToggledMusic] = React.useState(false);

            // Estats de la ruleta i animacions
            const [animateBall, setAnimateBall] = React.useState(false);
            const [isSpinning, setIsSpinning] = React.useState(false);
            const [spinningIndex, setSpinningIndex] = React.useState(null);
            
            // Nous estats pedagògics
            const [nomenclature, setNomenclature] = React.useState('random'); // 'stock', 'systematic', 'random'
            const [hideFormulas, setHideFormulas] = React.useState(true);
            const [revealedCurrent, setRevealedCurrent] = React.useState(false);
            const [cardFormat, setCardFormat] = React.useState('formulas');
            const [isVerifyingBingo, setIsVerifyingBingo] = React.useState(false); // Nou estat per comprovar bingo

            React.useEffect(() => {
                setCards(generateCards(30));
                if (audioRef.current) {
                    audioRef.current.volume = 0.35; // Volum suau perquè el profe pugui parlar
                }
            }, []);

            const handleRegenerate = () => {
                if (window.confirm("Vols generar 30 cartrons nous? Els actuals es perdran.")) {
                    setCards(generateCards(30));
                    setDrawnIndexes([]);
                }
            };

            const toggleMusic = () => {
                setUserToggledMusic(true);
                if (audioRef.current) {
                    if (isMusicPlaying) {
                        audioRef.current.pause();
                        setIsMusicPlaying(false);
                    } else {
                        audioRef.current.play()
                            .then(() => setIsMusicPlaying(true))
                            .catch(err => {
                                console.error("Error d'àudio:", err);
                                setIsMusicPlaying(false);
                            });
                    }
                }
            };

            const drawCompound = () => {
                if (drawnIndexes.length >= COMPOUNDS.length) {
                    alert("Ja s'han extret tots els compostos!");
                    return;
                }
                if (isSpinning) return;
                
                // Auto-iniciar la música a la primera tirada (estil Kahoot) si el profe no l'ha tocat
                if (!userToggledMusic && !isMusicPlaying && audioRef.current) {
                    audioRef.current.play()
                        .then(() => setIsMusicPlaying(true))
                        .catch(err => {
                            console.log("Àudio bloquejat pel navegador:", err);
                            setIsMusicPlaying(false);
                        });
                }
                
                setIsSpinning(true);
                setAnimateBall(false);
                setRevealedCurrent(false);
                setIsVerifyingBingo(false); // Amaguem la comprovació si traiem una bola nova
                
                // Extraiem només els índexs per saber quins falten
                const drawnIds = drawnIndexes.map(d => d.index);
                const availableIndexes = COMPOUNDS.map((_, i) => i).filter(i => !drawnIds.includes(i));
                
                let spins = 0;
                const maxSpins = 20;
                
                const spinInterval = setInterval(() => {
                    const randomIdx = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
                    setSpinningIndex(randomIdx);
                    spins++;
                    
                    if (spins >= maxSpins) {
                        clearInterval(spinInterval);
                        
                        const finalNext = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
                        
                        // Determinem quina nomenclatura se li assigna a aquesta bola
                        let nomType = nomenclature;
                        if (nomType === 'random') {
                            nomType = Math.random() > 0.5 ? 'stock' : 'systematic';
                        }
                        
                        setDrawnIndexes([{ index: finalNext, type: nomType }, ...drawnIndexes]);
                        setSpinningIndex(null);
                        setIsSpinning(false);
                        setAnimateBall(true);
                        
                        setTimeout(() => setAnimateBall(false), 500);
                    }
                }, 75);
            };

            const resetGame = () => {
                if (window.confirm("Vols reiniciar la partida (esborrar els compostos extrets)?")) {
                    setDrawnIndexes([]);
                    setRevealedCurrent(false);
                    setIsVerifyingBingo(false);
                }
            };

            return (
                <div className="min-h-screen pb-10">
                    {/* Element d'àudio per la música de fons (Loop divertit tipus Kahoot) */}
                    {/* Nota: L'arxiu .ogg funciona a Chrome/Firefox. Si fas servir Safari/iPhone i no s'escolta, necessitaràs canviar l'enllaç per un arxiu .mp3 */}
                    <audio ref={audioRef} loop crossOrigin="anonymous" src="https://upload.wikimedia.org/wikipedia/commons/c/c5/Kevin_MacLeod_-_Funk_Game_Loop.ogg"></audio>

                    {/* ENCAPÇALAMENT - S'amaga a l'imprimir */}
                    <div className="bg-blue-600 text-white p-6 shadow-md no-print mb-6">
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 className="text-3xl font-bold">Bingo de Formulació (3r ESO)</h1>
                                <p className="text-blue-100 mt-1 mb-3">Òxids, Hidrurs i Sals Binàries</p>
                                {/* Selector global de Nomenclatura */}
                                <div className="flex items-center gap-2 text-sm bg-blue-700/50 p-2 rounded-lg w-fit border border-blue-500">
                                    <span className="font-bold text-blue-50">Nomenclatura:</span>
                                    <select 
                                        value={nomenclature} 
                                        onChange={(e) => setNomenclature(e.target.value)}
                                        className="bg-white text-blue-900 rounded px-2 py-1 font-semibold outline-none cursor-pointer"
                                    >
                                        <option value="random">Barrejada (Aleatòria)</option>
                                        <option value="stock">Només Stock</option>
                                        <option value="systematic">Només Estequiomètrica</option>
                                    </select>
                                </div>
                            </div>
                            <div className="flex gap-2 mt-4 md:mt-0 flex-wrap">
                                <button 
                                    onClick={toggleMusic}
                                    title="Música de fons"
                                    className={`px-4 py-2 rounded font-black flex items-center justify-center text-xl transition-all border-2 border-transparent ${isMusicPlaying ? 'bg-yellow-400 text-blue-900 hover:bg-yellow-500 shadow-inner' : 'bg-blue-800 text-blue-300 hover:bg-blue-900 border-blue-700'}`}
                                >
                                    {isMusicPlaying ? '🔊' : '🔇'}
                                </button>
                                <button 
                                    onClick={() => setActiveTab('cards')}
                                    className={`px-4 py-2 rounded font-semibold ${activeTab === 'cards' ? 'bg-white text-blue-600' : 'bg-blue-700 hover:bg-blue-800'}`}
                                >
                                    Veure Cartrons
                                </button>
                                <button 
                                    onClick={() => setActiveTab('caller')}
                                    className={`px-4 py-2 rounded font-semibold ${activeTab === 'caller' ? 'bg-white text-blue-600' : 'bg-blue-700 hover:bg-blue-800'}`}
                                >
                                    Panell del Professor
                                </button>
                                <button 
                                    onClick={() => window.print()} 
                                    className="px-4 py-2 bg-green-500 hover:bg-green-600 rounded font-semibold flex items-center gap-2"
                                >
                                    🖨️ Imprimir Cartrons
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-4">
                        
                        {/* PANELL DEL PROFESSOR (BOMBO) */}
                        {activeTab === 'caller' && (
                            <div className="no-print bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-gray-200">
                                <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                                    <h2 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">🎰 Màquina del Bingo</h2>
                                    
                                    {/* Toggle Pedagògic */}
                                    <label className="flex items-center gap-3 bg-slate-100 px-4 py-2 rounded-full cursor-pointer hover:bg-slate-200 transition-colors border border-slate-300">
                                        <div className="relative">
                                            <input type="checkbox" className="sr-only" checked={hideFormulas} onChange={(e) => setHideFormulas(e.target.checked)} />
                                            <div className={`block w-10 h-6 rounded-full transition-colors ${hideFormulas ? 'bg-blue-600' : 'bg-gray-400'}`}></div>
                                            <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${hideFormulas ? 'transform translate-x-4' : ''}`}></div>
                                        </div>
                                        <span className="font-bold text-slate-700 text-sm">Mode Classe: Amagar fòrmules</span>
                                    </label>
                                </div>
                                
                                <div className="grid md:grid-cols-[1.5fr_1fr] gap-8">
                                    
                                    {/* Zona Llampant d'Extracció */}
                                    <div className="relative flex flex-col items-center justify-center bg-slate-900 p-10 rounded-[2rem] border-4 border-slate-800 box-glow overflow-hidden min-h-[450px]">
                                        {/* Efectes de fons lluminosos */}
                                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/40 via-slate-900/80 to-slate-900 pointer-events-none"></div>
                                        
                                        {/* Anelles de la Ruleta Giratòria (només visibles quan gira) */}
                                        <div className={`absolute w-96 h-96 border-[12px] border-dashed border-cyan-500/30 rounded-full pointer-events-none transition-all duration-500 ${isSpinning ? 'animate-[spin_0.8s_linear_infinite] scale-100 opacity-100' : 'scale-50 opacity-0'}`}></div>
                                        <div className={`absolute w-72 h-72 border-[8px] border-dashed border-pink-500/30 rounded-full pointer-events-none transition-all duration-500 delay-75 ${isSpinning ? 'animate-[spin_0.5s_linear_infinite_reverse] scale-100 opacity-100' : 'scale-50 opacity-0'}`}></div>

                                        {isSpinning && spinningIndex !== null ? (
                                            <div className="relative z-10 flex flex-col items-center w-full">
                                                <div className="text-sm font-bold text-pink-400 uppercase tracking-[0.3em] mb-6 drop-shadow-md animate-pulse">La ruleta està girant...</div>
                                                
                                                {/* Text girant */}
                                                <div className={`text-4xl md:text-6xl font-black text-white mb-8 blur-[2px] scale-110 transition-all duration-75 text-center opacity-80 px-4 ${!hideFormulas && 'text-7xl md:text-8xl'}`}>
                                                    {hideFormulas ? COMPOUNDS[spinningIndex][nomenclature === 'systematic' ? 'systematic' : 'stock'] : <FormatFormula text={COMPOUNDS[spinningIndex].formula} />}
                                                </div>
                                            </div>
                                        ) : drawnIndexes.length > 0 ? (
                                            <div className={`relative z-10 flex flex-col items-center w-full ${animateBall ? 'animate-pop' : ''}`}>
                                                <div className="text-sm font-bold text-blue-400 uppercase tracking-[0.3em] mb-4 drop-shadow-md">Últim compost extret</div>
                                                
                                                {/* SI AMAGUEM FÒRMULES: El nom és gegant */}
                                                {hideFormulas ? (
                                                    <div className="flex flex-col items-center w-full gap-6">
                                                        <div className="text-3xl md:text-4xl lg:text-5xl font-black text-white text-center leading-tight">
                                                            {COMPOUNDS[drawnIndexes[0].index][drawnIndexes[0].type]}
                                                        </div>
                                                        
                                                        {/* Zona de solució amagada */}
                                                        <div className="w-full max-w-sm mt-4">
                                                            {revealedCurrent ? (
                                                                <div className="bg-slate-800/80 p-6 rounded-2xl border border-cyan-500/50 shadow-[0_0_20px_rgba(34,211,238,0.2)]">
                                                                    <div className="text-sm text-cyan-400 font-bold mb-2 text-center uppercase tracking-wider">Solució</div>
                                                                    <div className="text-6xl font-black text-cyan-300 text-glow text-center">
                                                                        <FormatFormula text={COMPOUNDS[drawnIndexes[0].index].formula} />
                                                                    </div>
                                                                </div>
                                                            ) : (
                                                                <button 
                                                                    onClick={() => setRevealedCurrent(true)}
                                                                    className="w-full px-6 py-4 bg-slate-800 hover:bg-slate-700 border-2 border-dashed border-slate-600 hover:border-cyan-500/50 rounded-2xl text-slate-400 hover:text-cyan-400 font-bold text-lg transition-all flex flex-col items-center gap-2"
                                                                >
                                                                    <span className="text-2xl">👁️</span>
                                                                    <span>Revelar la fòrmula</span>
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    // MODE CLÀSSIC (es veu tot d'inici)
                                                    <div className="flex flex-col items-center w-full">
                                                        <div className="text-7xl md:text-8xl font-black text-cyan-300 mb-8 text-glow tracking-wider text-center">
                                                            <FormatFormula text={COMPOUNDS[drawnIndexes[0].index].formula} />
                                                        </div>
                                                        <div className="text-2xl md:text-3xl font-bold text-white bg-white/10 backdrop-blur-md px-8 py-4 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-white/20 text-center w-full max-w-lg">
                                                            {COMPOUNDS[drawnIndexes[0].index][drawnIndexes[0].type]}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="relative z-10 text-slate-400 text-xl text-center font-medium animate-pulse">
                                                Fes clic a "Extreure Compost" per fer girar la ruleta! 🎡
                                            </div>
                                        )}
                                        
                                        {/* Botó (dins la zona fosca) */}
                                        <div className="relative z-10 mt-auto pt-10 flex flex-col sm:flex-row gap-4 w-full justify-center px-4">
                                            <button 
                                                onClick={drawCompound}
                                                disabled={isSpinning}
                                                className={`px-8 py-5 rounded-full font-black text-xl shadow-[0_0_25px_rgba(236,72,153,0.6)] transition-all flex items-center justify-center gap-3 w-full md:w-auto border-2 border-white/20
                                                    ${isSpinning 
                                                        ? 'bg-slate-700 text-slate-400 cursor-not-allowed shadow-none border-slate-600' 
                                                        : 'bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 hover:from-pink-600 hover:via-purple-600 hover:to-indigo-600 text-white transform hover:scale-105 active:scale-95'}`}
                                            >
                                                {isSpinning ? '🎡 GIRANT...' : '🎲 EXTREURE COMPOST'}
                                            </button>
                                        </div>
                                    </div>
                                    
                                    {/* Historial Millorat */}
                                    <div className="bg-gray-50 rounded-[2rem] p-6 border border-gray-200 shadow-inner flex flex-col h-full">
                                        <div className="flex justify-between items-center mb-4 pb-4 border-b-2 border-gray-200">
                                            <h3 className="font-black text-xl text-gray-800">📋 Historial</h3>
                                            <div className="bg-indigo-100 text-indigo-800 font-bold px-4 py-1.5 rounded-full text-sm shadow-sm border border-indigo-200">
                                                {drawnIndexes.length} de {COMPOUNDS.length}
                                            </div>
                                        </div>
                                        <div className="flex-1 overflow-y-auto pr-2 flex flex-col gap-3" style={{maxHeight: "400px"}}>
                                            {drawnIndexes.map((drawnItem, i) => {
                                                const isCurrent = i === 0;
                                                // La fòrmula de l'historial es mostra si:
                                                // 1. Estem comprovant un bingo
                                                // 2. No estem amagant fòrmules al Mode Classe
                                                // 3. És la bola actual i el professor l'ha revelat a mà
                                                const showFormula = isVerifyingBingo || !hideFormulas || (isCurrent && revealedCurrent);

                                                return (
                                                    <div key={i} className={`flex items-center gap-4 p-3 rounded-xl border-2 transition-colors ${isCurrent ? 'bg-indigo-50 border-indigo-300 shadow-md transform scale-[1.02]' : 'bg-white border-transparent hover:border-gray-200 shadow-sm'}`}>
                                                        <div className={`w-16 h-12 flex items-center justify-center font-black text-lg rounded-lg ${isCurrent ? 'bg-indigo-600 text-white shadow-inner' : 'bg-gray-100 text-gray-700'}`}>
                                                            {showFormula ? <FormatFormula text={COMPOUNDS[drawnItem.index].formula} /> : '❓'}
                                                        </div>
                                                        <div className={`text-sm flex-1 font-medium leading-tight ${isCurrent ? 'text-indigo-900' : 'text-gray-600'}`}>
                                                            {COMPOUNDS[drawnItem.index][drawnItem.type]}
                                                        </div>
                                                        <div className="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md">
                                                            #{drawnIndexes.length - i}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {drawnIndexes.length === 0 && (
                                                <div className="flex-1 flex items-center justify-center text-gray-400 italic font-medium h-32">
                                                    Cap compost extret encara.
                                                </div>
                                            )}
                                        </div>
                                        <div className="mt-6 flex flex-col gap-3">
                                            <button 
                                                onClick={() => setIsVerifyingBingo(!isVerifyingBingo)}
                                                disabled={drawnIndexes.length === 0}
                                                className={`w-full py-3 rounded-xl font-bold transition-colors border ${isVerifyingBingo ? 'bg-amber-100 text-amber-700 border-amber-300 hover:bg-amber-200' : 'bg-amber-50 text-amber-600 border-amber-200 hover:bg-amber-100'} disabled:opacity-50 disabled:cursor-not-allowed`}
                                            >
                                                {isVerifyingBingo ? '🙈 Amagar Fòrmules' : '🔍 Comprovar Bingo'}
                                            </button>
                                            <button 
                                                onClick={resetGame}
                                                className="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl font-bold transition-colors border border-red-200"
                                            >
                                                🔄 Reiniciar Partida
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ZONA DE CARTRONS */}
                        <div className={activeTab === 'cards' ? 'block' : 'hidden no-print'}>
                            <div className="no-print bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                                <div>
                                    <h3 className="font-bold text-gray-800">Opcions d'Impressió:</h3>
                                    <p className="text-sm text-gray-500">Què vols que hi hagi imprès als cartrons dels alumnes?</p>
                                </div>
                                
                                <div className="flex bg-gray-100 p-1 rounded-lg">
                                    <button 
                                        onClick={() => setCardFormat('formulas')}
                                        className={`px-4 py-2 rounded-md text-sm font-bold transition-colors ${cardFormat === 'formulas' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                    >
                                        Fòrmules (Ex: Na₂O)
                                    </button>
                                    <button 
                                        onClick={() => setCardFormat('names')}
                                        className={`px-4 py-2 rounded-md text-sm font-bold transition-colors ${cardFormat === 'names' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                    >
                                        Noms (Ex: Òxid de sodi)
                                    </button>
                                </div>

                                <button onClick={handleRegenerate} className="px-4 py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-sm font-bold transition-colors">
                                    🔄 Generar 30 nous
                                </button>
                            </div>

                            {/* Contenidor dels cartrons per pantalla i per impressió */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 print:block print:gap-0">
                                {cards.map((card, idx) => (
                                    <div 
                                        key={card.id} 
                                        className={`bg-white p-4 border-2 border-gray-800 rounded-lg shadow-sm print-break-avoid print:shadow-none print:border-4 print:mb-8 print:w-full`}
                                        style={(idx + 1) % 5 === 0 ? { pageBreakAfter: 'always' } : {}}
                                    >
                                        <div className="flex justify-between items-center mb-3 border-b-2 border-gray-800 pb-2">
                                            <h2 className="font-black text-xl uppercase tracking-widest text-gray-800">Bingo Químic</h2>
                                            <div className="text-sm font-bold text-gray-500">Cartó #{card.id}</div>
                                        </div>
                                        
                                        {/* La quadrícula de 3 files i 7 columnes */}
                                        <div className="grid grid-cols-7 grid-rows-3 gap-0 border-t border-l border-gray-800">
                                            {card.cells.map((cell, cellIdx) => (
                                                <div 
                                                    key={cellIdx} 
                                                    className={`
                                                        border-r border-b border-gray-800 h-12 print:h-14 flex items-center justify-center p-1
                                                        ${cell ? 'bg-white' : 'bg-gray-100 print:bg-gray-50'}
                                                    `}
                                                >
                                                    {cell && (
                                                        <span className={`font-bold text-center leading-tight ${cardFormat === 'formulas' ? 'text-lg print:text-xl' : 'text-[10px] print:text-xs'}`}>
                                                            {cardFormat === 'formulas' ? <FormatFormula text={cell.formula} /> : cell[nomenclature === 'random' ? cell.cardNomType : nomenclature]}
                                                        </span>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                        <div className="text-[10px] text-gray-400 text-center mt-2 print:text-black">
                                            3r ESO - Òxids, Hidrurs i Sals Binàries
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
